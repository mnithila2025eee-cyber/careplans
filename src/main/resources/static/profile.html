<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="user-dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

.profile-card {

background:white;

border-radius:14px;

padding:30px;

max-width:700px;

}

.profile-header {

display:flex;

align-items:center;

gap:20px;

margin-bottom:30px;

}

.big-avatar {

width:70px;

height:70px;

border-radius:50%;

background:#dbeafe;

color:#2563eb;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

font-weight:700;

}

.profile-header h2 {

font-size:18px;

}

.profile-header p {

font-size:10px;

color:#8992a5;

margin-top:5px;

}

.profile-row {

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:20px;

}

.field label {

display:block;

font-size:10px;

color:#8992a5;

margin-bottom:7px;

}

.field input {

width:100%;

padding:11px;

border:1px solid #e5e9f0;

border-radius:7px;

outline:none;

font-size:11px;

}

.save {

background:#2563eb;

color:white;

border:none;

padding:11px 20px;

border-radius:7px;

cursor:pointer;

font-size:11px;

}

</style>

</head>


<body>

<div class="app">


<aside class="sidebar">

<div class="logo">

<div class="logo-icon">
<i class="fas fa-landmark"></i>
</div>

<div>
<h2>Municipal Library</h2>
<span>Digital Library</span>
</div>

</div>


<nav>

<a href="user-dashboard.html">
<i class="fas fa-house"></i>
Dashboard
</a>

<a href="books.html">
<i class="fas fa-book"></i>
E-Books
</a>

<a href="my-books.html">
<i class="fas fa-book-open"></i>
My Books
</a>

<a href="access-records.html">
<i class="fas fa-clock-rotate-left"></i>
Access History
</a>

<a href="my-licenses.html">
<i class="fas fa-file-contract"></i>
My Licenses
</a>

<a href="alerts.html">
<i class="fas fa-bell"></i>
Notifications
</a>

<a href="profile.html" class="active">
<i class="fas fa-user"></i>
My Profile
</a>

</nav>


<div class="logout">

<a href="index.html">
<i class="fas fa-right-from-bracket"></i>
Logout
</a>

</div>

</aside>


<main class="main">

<header class="topbar">

<div>

<h1>My Profile</h1>

<p>Manage your library membership information</p>

</div>

</header>


<div class="profile-card">


<div class="profile-header">

<div class="big-avatar">
U
</div>

<div>

<h2>Library User</h2>

<p>Active Library Member</p>

</div>

</div>


<div class="profile-row">

<div class="field">

<label>Full Name</label>

<input type="text"
value="Library User">

</div>


<div class="field">

<label>Email</label>

<input type="email"
value="user@library.com">

</div>

</div>


<div class="profile-row">

<div class="field">

<label>Phone Number</label>

<input type="text"
value="+91 9876543210">

</div>


<div class="field">

<label>Membership ID</label>

<input type="text"
value="LIB2026001"
readonly>

</div>

</div>


<button class="save"
onclick="saveProfile()">

Save Changes

</button>


</div>

</main>

</div>


<script>

function saveProfile() {

alert("Profile updated successfully.");

}

</script>

</body>

</html>
